<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingeniería en Sistemas - Ruta de Carrera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Componente de Icono Simple para reemplazar lucide-react en el navegador
        const Icon = ({ name, className = "w-6 h-6" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const stages = {
            basic: {
                id: 'basic',
                title: 'Fase 1: Fundamentos',
                subtitle: 'Semestres 1-3',
                description: 'Construyendo la lógica y la base matemática.',
                color: 'bg-blue-600',
                textColor: 'text-blue-600',
                icon: 'code',
                subjects: [
                    'Introducción a la Programación (Lógica)',
                    'Cálculo Diferencial e Integral',
                    'Álgebra Lineal',
                    'Física Básica',
                    'Estructuras Discretas'
                ],
                techStack: [
                    { name: 'Python/C++', desc: 'Lenguajes tipados y de script para entender memoria.' },
                    { name: 'Git & GitHub', desc: 'Aprende control de versiones desde el día 1.' },
                    { name: 'Linux Basics', desc: 'Manejo básico de terminal y sistemas.' }
                ],
                advice: [
                    'No copies código, entiéndelo. La lógica es más importante.',
                    'Las matemáticas desarrollan tu pensamiento abstracto.',
                    'Aprende inglés técnico, la mejor documentación está ahí.'
                ]
            },
            intermediate: {
                id: 'intermediate',
                title: 'Fase 2: Núcleo Profesional',
                subtitle: 'Semestres 4-7',
                description: 'Desarrollo de software robusto y comprensión de sistemas.',
                color: 'bg-indigo-600',
                textColor: 'text-indigo-600',
                icon: 'layers',
                subjects: [
                    'Estructuras de Datos y Algoritmos',
                    'Bases de Datos (SQL/NoSQL)',
                    'Sistemas Operativos',
                    'Redes de Computadoras',
                    'Ingeniería de Software'
                ],
                techStack: [
                    { name: 'Java/C#', desc: 'Programación Orientada a Objetos (POO) estricta.' },
                    { name: 'SQL & MongoDB', desc: 'Modelado y persistencia de datos.' },
                    { name: 'Docker', desc: 'Introducción a contenedores y despliegue.' },
                    { name: 'React/Angular', desc: 'Desarrollo Frontend moderno.' }
                ],
                advice: [
                    'Empieza a construir un portafolio en GitHub con proyectos.',
                    'Participa en Hackathones para trabajar en equipo.',
                    'Elige tus electivas pensando en tu especialidad.'
                ]
            },
            advanced: {
                id: 'advanced',
                title: 'Fase 3: Especialización',
                subtitle: 'Semestres 8-10',
                description: 'Maestría técnica, tesis y preparación laboral.',
                color: 'bg-purple-600',
                textColor: 'text-purple-600',
                icon: 'cpu',
                subjects: [
                    'Inteligencia Artificial / ML',
                    'Arquitectura de Software',
                    'Seguridad Informática',
                    'Gerencia de Proyectos',
                    'Computación en la Nube'
                ],
                techStack: [
                    { name: 'AWS/Azure', desc: 'Servicios en la nube y Serverless.' },
                    { name: 'CI/CD Actions', desc: 'Automatización de despliegues (DevOps).' },
                    { name: 'Microservicios', desc: 'Arquitecturas distribuidas complejas.' }
                ],
                advice: [
                    'Enfócate en tu Tesis, resuelve un problema real.',
                    'Mejora tus Soft Skills: comunicación y liderazgo.',
                    'Prepara tu LinkedIn y practica entrevistas técnicas.'
                ]
            }
        };

        const ResourceCard = ({ title, items, icon, iconColor }) => (
            <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                <div className="flex items-center gap-2 mb-4 text-gray-800 font-semibold border-b pb-2">
                    <Icon name={icon} className={`w-5 h-5 ${iconColor}`} />
                    <h3>{title}</h3>
                </div>
                <ul className="space-y-3">
                    {items.map((item, idx) => (
                        <li key={idx} className="flex items-start gap-2 text-sm text-gray-600">
                            {typeof item === 'string' ? (
                                <>
                                    <Icon name="chevron-right" className="w-4 h-4 mt-0.5 text-blue-500 shrink-0" />
                                    <span>{item}</span>
                                </>
                            ) : (
                                <div className="flex flex-col">
                                    <span className="font-medium text-gray-800">{item.name}</span>
                                    <span className="text-xs text-gray-500">{item.desc}</span>
                                </div>
                            )}
                        </li>
                    ))}
                </ul>
            </div>
        );

        function CareerNavigator() {
            const [activeStage, setActiveStage] = useState('basic');

            return (
                <div className="min-h-screen font-sans text-slate-900 p-4 md:p-8">
                    <div className="max-w-6xl mx-auto">
                        
                        <header className="mb-8 text-center md:text-left">
                            <h1 className="text-3xl md:text-4xl font-bold text-slate-800 mb-2">
                                Ingeniería en Sistemas: <span className="text-blue-600">Tu Ruta al Éxito</span>
                            </h1>
                            <p className="text-slate-600 text-lg">
                                Guía interactiva de mentoría académica y profesional.
                            </p>
                        </header>

                        <div className="flex flex-col md:flex-row gap-4 mb-8">
                            {Object.values(stages).map((stage) => (
                                <button
                                    key={stage.id}
                                    onClick={() => setActiveStage(stage.id)}
                                    className={`flex-1 p-4 rounded-xl border transition-all duration-200 flex items-center justify-center gap-3
                                        ${activeStage === stage.id 
                                            ? `${stage.color} text-white shadow-lg scale-105 border-transparent` 
                                            : 'bg-white text-gray-600 hover:bg-gray-50 border-gray-200'
                                        }`}
                                >
                                    <div className={`p-2 rounded-full ${activeStage === stage.id ? 'bg-white/20' : 'bg-gray-100 text-gray-500'}`}>
                                        <Icon name={stage.icon} />
                                    </div>
                                    <div className="text-left">
                                        <div className="font-bold text-sm md:text-base">{stage.title}</div>
                                        <div className="text-xs opacity-90">{stage.subtitle}</div>
                                    </div>
                                </button>
                            ))}
                        </div>

                        <div key={activeStage} className="animate-fade-in">
                            <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-gray-200 mb-8">
                                <div className="flex items-center gap-3 mb-6">
                                    <div className={`p-3 rounded-lg ${stages[activeStage].color} bg-opacity-10`}>
                                        <Icon name={stages[activeStage].icon} className={`w-8 h-8 ${stages[activeStage].textColor}`} />
                                    </div>
                                    <div>
                                        <h2 className="text-2xl font-bold text-gray-800">{stages[activeStage].title}</h2>
                                        <p className="text-gray-500">{stages[activeStage].description}</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <ResourceCard 
                                        title="Materias Clave" 
                                        icon="book-open"
                                        iconColor="text-emerald-600"
                                        items={stages[activeStage].subjects} 
                                    />
                                    <ResourceCard 
                                        title="Stack Tecnológico" 
                                        icon="terminal"
                                        iconColor="text-blue-600"
                                        items={stages[activeStage].techStack} 
                                    />
                                    <ResourceCard 
                                        title="Consejo del Mentor" 
                                        icon="award"
                                        iconColor="text-amber-500"
                                        items={stages[activeStage].advice} 
                                    />
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-slate-800 text-white p-6 rounded-2xl">
                                <h3 className="flex items-center gap-2 text-xl font-bold mb-4">
                                    <Icon name="shield" className="w-6 h-6 text-cyan-400" />
                                    Habilidades Transversales
                                </h3>
                                <ul className="space-y-3">
                                    <li className="flex items-center gap-3">
                                        <Icon name="check-circle" className="w-5 h-5 text-cyan-400" />
                                        <span>Inglés (Nivel B2 mínimo)</span>
                                    </li>
                                    <li className="flex items-center gap-3">
                                        <Icon name="check-circle" className="w-5 h-5 text-cyan-400" />
                                        <span>Metodologías Ágiles (Scrum)</span>
                                    </li>
                                    <li className="flex items-center gap-3">
                                        <Icon name="check-circle" className="w-5 h-5 text-cyan-400" />
                                        <span>Autoaprendizaje constante</span>
                                    </li>
                                </ul>
                            </div>

                            <div className="bg-white border border-gray-200 p-6 rounded-2xl">
                                <h3 className="flex items-center gap-2 text-xl font-bold mb-4 text-gray-800">
                                    <Icon name="users" className="w-6 h-6 text-purple-600" />
                                    ¿Cómo te puedo ayudar?
                                </h3>
                                <div className="flex flex-wrap gap-2">
                                    {['Explicar Polimorfismo', 'Ideas de Tesis', 'Revisar Código', 'Simular Entrevista'].map(tag => (
                                        <span key={tag} className="bg-purple-50 text-purple-700 px-3 py-1 rounded-full text-xs font-medium border border-purple-100">
                                            {tag}
                                        </span>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CareerNavigator />);
    </script>
</body>
</html>
